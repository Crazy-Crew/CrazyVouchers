name: Notify Release

on:
  workflow_dispatch:

  workflow_run:
    workflows: [ "Publish Release", "Publish Snapshot" ]
    types:
      - completed

jobs:
  build:
    steps:
      - uses: Crazy-Crew/.github/.github/workflows/notify.yml@main
        if: github.event.workflow_run.name == 'Publish Snapshot'

        with:
          status: "beta"
          branch: main

        secrets:
          webhook: ${{ secrets.BUILD_WEBHOOK }}

      - uses: Crazy-Crew/.github/.github/workflows/notify.yml@main
        if: github.event.workflow_run.name == 'Publish Release'

        with:
          status: "release"
          branch: main

        secrets:
          webhook: ${{ secrets.BUILD_WEBHOOK }}