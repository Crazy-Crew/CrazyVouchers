# This will write to console!
writerConsole = console
writerConsole.level = info
writerConsole.format = [{date: HH:mm:ss} {level}] [Tracking thread/{file}]: {message}
writerConsole.tag = -

# This will write to file as rolling release!
writerFile = rolling file
writerFile.level = info
writerFile.format = [{date: HH:mm:ss} {level}] [Tracking thread/{file}]: {message}
writerFile.file = #{crazyvouchers.directory}/logs/{date: yyyy-MM-dd}-{count}.log
writerFile.latest = #{crazyvouchers.directory}/logs/latest.log
writerFile.charset = UTF-8
writerFile.buffered = false
writerFile.policies = startup
writerFile.convert = gzip